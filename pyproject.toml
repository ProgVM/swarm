[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmai"
version = "1.1.5"
authors = [
  { name="ProgVM", email="progvminc@gmail.com" },
]
description = "A highly flexible multi-agent ReAct framework powered by Google Gemini with advanced Memory, RAG, and Network resilience"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-genai>=0.2.0",
    "duckduckgo-search>=6.0.0",
]

[project.urls]
"Homepage" = "https://github.com/ProgVM"

[project.scripts]
swarm = "swarm.cli:run"
